name: TruthGate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build setuptools wheel

    - name: Run Deep Regression Tests
      run: |
        python tests/test_all_truthgate_gates_deep.py

    - name: Build Package
      run: |
        python -m build
